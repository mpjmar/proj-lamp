<div class="cabecera">
  <div>
    @if (this.enchufada) {
      <span>Estado conexión eléctrica: ENCHUFADA</span>
    } @else {
      <span>Estado conexión eléctrica: DESENCHUFADA</span>
    }
  </div>
  <div>
    <span>{{ "Último estado recibido: " + this.estadoLampara }}</span>
  </div>
  <div>
    @if (this.enchufada) {
      <button (click)="onDesenchufar()">DESENCHUFAR</button>
    } @else {
      <button (click)="onEnchufar()">ENCHUFAR</button>
    }
  </div>
</div>

<app-lampara
  [enchufada]="enchufada"
  (estadoLampara)="onCambioEstado($event)"
></app-lampara>
